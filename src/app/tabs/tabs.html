<main>
  <div ngTabs>
    <ul ngTabList selectedTab="overview">
      <li ngTab value="overview">Overview</li>
      <li ngTab value="members">Members</li>
      <li ngTab value="billing">Billing</li>
    </ul>

    <section ngTabPanel value="overview">
      <ng-template ngTabContent>
        <h3>Project overview</h3>
        <p>
          This project is running in <strong>production</strong>. Changes here take effect
          immediately.
        </p>
      </ng-template>
    </section>

    <section ngTabPanel value="members">
      <ng-template ngTabContent>
        <h3>Team members</h3>
        <p>Manage who has access to this project and what they can do.</p>
      </ng-template>
    </section>

    <section ngTabPanel value="billing">
      <ng-template ngTabContent>
        <h3>Billing</h3>
        <p>View invoices, update payment methods, or change your plan.</p>
      </ng-template>
    </section>
  </div>
</main>
